
#Todas las configuraciones relacionadas con el núcleo del juego
[gameplay]
	#Cantidad inicial de ciudadanos. [Predeterminado: 4, min: 1, max: 10]
	#Range: 1 ~ 10
	initialcitizenamount = 4
	#¿Colocar cinta alrededor de los edificios en construcción? [Predeterminado: true]
	builderplaceconstructiontape = true
	#¿Pueden los jugadores poder colocar una cantidad infinita de campamentos / barcos de suministros? [Predeterminado: false]
	allowinfinitesupplychests = false
	#¿Podrian los jugadores abandonar su colonia para crear una nueva fácilmente? Nota: ¡Esto tiene errores! [Predeterminado: false]
	allowinfinitecolonies = false
	#¿Permitir colonias en otras dimensiones? [Predeterminado: true]
	allowotherdimcolonies = true
	#Si la colonia está por debajo del numero inicial de ciudadanos, esto cambia la cantidad de tiempo antes de que aparezcan un nuevo ciudadano. [Predeterminado: 60, min: 10, max: 600]
	#Range: 10 ~ 600
	citizenrespawninterval = 60
	#Número máximo de ciudadanos en una colonia. [Predeterminado: 250, min: 4, max: 500]
	#Range: 4 ~ 500
	maxcitizenpercolony = 250
	#Retraso después de colocar cada bloque (Al aumentar, aumenta el retraso). [Predeterminado: 15, min: 1, max: 500]
	#Range: 1 ~ 500
	builderbuildblockdelay = 15
	#Modificador del tiempo en picar un bloque (Reducirlo disminuye el tiempo). [Predeterminado: 500, min: 1, max: 10000]
	#Range: 1 ~ 10000
	blockminingdelaymodifier = 500
	#¿Activar características en desarrollo? (Puede causar fallos)? [Predeterminado: false]
	enableindevelopmentfeatures = false
	#¿Se muestran las etiquetas de los nombres de los ciudadanos? [Predeterminado: true]
	alwaysrendernametag = true
	#¿Trabajarán los ciudadanos bajo la lluvia? [Predeterminado: false]
	workersalwaysworkinrain = false
	#¿Recibir un anuncio al entrar/salir de una colonia? [Predeterminado: true]
	sendenteringleavingmessages = true
	#¿Permitir cambiar el nombre de los ciudadanos? -1 para falso, 0 solo para ciertos jugadores, 1 para verdadero. (Para establecer qué jugadores pueden cambiar los nombres, consulte 'Grupo de permisos especiales' a continuación) [Predeterminado: 1, min: -1, max: 1]
	#Range: -1 ~ 1
	allowglobalnamechanges = 1
	#¿Debería mostrarse contenido especial los días festivos? [Predeterminado: true]
	holidayfeatures = true
	#Cantidad de tierra para rellenar la compostadora. [Predeterminado: 1, min: 0, max: 100]
	#Range: 0 ~ 100
	dirtfromcompost = 1
	#Posibilidad de que el minero obtenga un mineral al extraer adoquines o piedras (de manera predeterminada, se puede expandir con paquetes de datos a otros materiales). Este es un porcentaje. (Para cambiar qué minerales puede encontrar el minero, consulta la "Lista de minerales de la suerte") [Predeterminado: 1, min: 0, max: 100]
	#Range: 0 ~ 100
	luckyblockchance = 1
	#El nivel mínimo que debe tener un Ayuntamiento para permitir la teletransportación a las colonias aliadas. [Predeterminado: 3, min: 0, max: 5]
	#Range: 0 ~ 5
	minthleveltoteleport = 3
	#Sugerir el uso de la herramienta de construcción cuando intente colocar un edificio sin la herramienta de construcción. [Predeterminado: true]
	suggestbuildtoolplacement = true
	#Modificador del consumo de alimentos. [Predeterminado: 1,000000, min: 0,100000, max: 100,000000]
	#Range: 0.1 ~ 100.0
	foodmodifier = 1.0
	#Qué tan comunes son las enfermedades. 1 = muy común, 100 = extremadamente raro. [Predeterminado: 5, min: 1, max: 100]
	#Range: 1 ~ 100
	diseasemodifier = 5
	#Si parte de la colonia es cargada por un propietario/oficial, ¿debe mantenerse cargada la colonia? (Establezca cuántos fragmentos se cargan con la opción "Estrictez de carga de fragmentos de colonia") [Predeterminado: false]
	forceloadcolony = false
	#Establece el tiempo que los chunks permanecen cargados después de que el jugador se vaya de la colonia, no se mantiene tras un reinicio. Por defecto: 10min [Predeterminado: 10, min: 1, max: 1440]
	#Range: 1 ~ 1440
	loadtime = 10
	#Esto controla cuántos fragmentos se cargan con la opción "Colonia de carga de fragmentos". Cuanto mayor sea este valor, menos fragmentos se cargarán. (Los fragmentos más internos se cargarán primero). 1 = cargar todos los fragmentos reclamados. [Predeterminado: 3, min: 1, max: 15]
	#Range: 1 ~ 15
	colonyloadstrictness = 3
	#Oportunidad de conseguir un visitante malvado de la taberna que se escapará con los recursos que le des. Esto es un %. [Predeterminado: 2, min: 1, max: 100]
	#Range: 1 ~ 100
	badvisitorchance = 2
	#Recuento máximo de troncos en un árbol para que el Leñador compruebe durante su búsqueda de árboles. [Predeterminado: 400, min: 1, max: 1000]
	#Range: 1 ~ 1000
	maxtreesize = 400
	#Deshabilita las restricciones de colocación de campamentos de suministro, destinadas a mundos del cielo y similares [Predeterminado: false]
	nosupplyplacementrestrictions = false
	#Los asaltantes aparecerán en el cielo si esto está habilitado [Predeterminado: false]
	skyraiders = false

#Todas las configuraciones relacionadas con el sistema de investigaciones
[research]
	#Permite la finalización automática y (casi) instantánea de la investigación para jugadores en modo creativo. Si es falso, los jugadores creativos aún podrán comenzar investigaciones, pero tendrán tasas de progreso normales. [Predeterminado: true]
	researchcreativecompletion = true
	#Aumenta significativamente la cantidad de información relacionada con los paquetes de datos de investigación que se registra durante la carga mundial. [Predeterminado: false]
	researchdebuglog = false
	#Una lista de elementos para cobrar a los jugadores al deshacer una investigación ya completada. 
	researchresetcost = ["minecolonies:ancienttome:1"]

#Todas las configuraciones relacionadas con los comandos de MineColonies
[commands]
	#¿Debería permitirse al jugador usar el comando '/mc rtp'? [Predeterminado: false]
	canplayerusertpcommand = false
	#¿Debería permitirse usar el comando /mc colony teleport a el jugador? [Predeterminado: false]
	canplayerusecolonytpcommand = false
	#¿Pueden los jugadores teletransportarse a colonias aliadas? [Predeterminado: true]
	canplayeruseallytownhallteleport = true
	#¿Debería permitirse a los jugadores utilizar el comando /mc home? Nota: Solo los propietarios de la colonia pueden usar este comando. [Predeterminado: false]
	canplayerusehometpcommand = false
	#¿Debería permitirse usar el comando '/mc citizens info' a jugadores? [Predeterminado: true]
	canplayeruseshowcolonyinfocommand = true
	#¿Debería permitirse usar el comando '/mc citizens kill' a jugadores? [Predeterminado: false]
	canplayerusekillcitizenscommand = false
	#¿Debería permitirse usar el comando '/mc colony addOfficer' a jugadores? [Predeterminado: true]
	canplayeruseaddofficercommand = true
	#¿Debería permitirse usar el comando '/mc colony delete' a jugadores? [Predeterminado: true]
	canplayerusedeletecolonycommand = true
	#Cantidad de intentos para encontrar un lugar de teletransporte seguro (con /mc rtp). [Predeterminado: 4, min: 1, max: 10]
	#Range: 1 ~ 10
	numberofattemptsforsafetp = 4

#Toda la configuración relacionada con el reclamo de colonias
[claims]
	#Rango máximo de territorio de una colonia. Este es el radio, medido en chunks. [Predeterminado: 20, min: 1, max: 250]
	#Range: 1 ~ 250
	maxColonySize = 20
	#La mínima distancia (en chunks) entre colonias. [Predeterminado: 8, min: 1, max: 200]
	#Range: 1 ~ 200
	minColonyDistance = 8
	#Tamaño máximo de territorio inicial de una colonia. Este es el radio, medido en chunks. [Predeterminado: 4, min: 1, max: 15]
	#Range: 1 ~ 15
	initialColonySize = 4
	#¿Debería la distancia min/máx afectar también la ubicacion de la colonia? [Predeterminado: false]
	restrictcolonyplacement = false
	#Máxima distancia (en bloques) desde el punto de aparición para una colonia. [Predeterminado: 8000, min: 1000, max: 100000]
	#Range: 1000 ~ 100000
	maxdistancefromworldspawn = 8000
	#Mínima distancia (en bloques) desde el punto de aparición para una colonia. [Predeterminado: 512, min: 1, max: 1000]
	#Range: 1 ~ 1000
	mindistancefromworldspawn = 512
	#¿Deberían los oficiales de una colonia recibir avances de esa colonia? [Predeterminado: true]
	officersreceiveadvancements = true

#Todos los elementos de configuración relacionada con los elementos de combate
[combat]
	#Deberían o no aparecer asaltantes. [Predeterminado: true]
	dobarbariansspawn = true
	#Ajuste de dificultad para los asaltantes. [Predeterminado: 5, min: 0, max: 10]
	#Range: 0 ~ 10
	barbarianhordedifficulty = 5
	#Máximo número de una horda de asaltantes. [Predeterminado: 80, min: 6, max: 400]
	#Range: 6 ~ 400
	maxBarbarianSize = 80
	#Whether or not raiders can break through obstacles [Predeterminado: true]
	dobarbariansbreakthroughwalls = true
	#Número de noches entre asaltos. [Predeterminado: 14, min: 1, max: 50]
	#Range: 1 ~ 50
	averagenumberofnightsbetweenraids = 14
	#La cantidad mínima de noches que deben pasar entre asaltos. [Predeterminado: 10, min: 1, max: 30]
	#Range: 1 ~ 30
	minimumnumberofnightsbetweenraids = 10
	#¿Deben atacar las entidades a los ciudadanos? [Predeterminado: true]
	mobattackcitizens = true
	#Si los asaltantes pueden atravesar puertas o no. [Predeterminado: true]
	shouldraiderbreakdoors = true
	#¿Deberían los ciudadanos llamar a los guardias para ayudarles cuando les atacan? [Predeterminado: true]
	citizencallforhelp = true
	#Multiplicador de daño de ataque para Guardias de arqueros. [Predeterminado: 1,000000, min: 0,100000, max: 5,000000]
	#Range: 0.1 ~ 5.0
	rangerdamagemult = 1.0
	#Multiplicador de ataque de caballero. [Predeterminado: 1,000000, min: 0,100000, max: 5,000000]
	#Range: 0.1 ~ 5.0
	knightdamagemult = 1.0
	#Multiplicador de salud de todos los guardias. [Predeterminado: 1,000000, min: 0,100000, max: 5,000000]
	#Range: 0.1 ~ 5.0
	guardhealthmult = 1.0
	#Activa el modo jugador contra jugador en Minecolonies, (las colonias pueden ser destruídas y pueden sufrir daños en ciertas condiciones). [Predeterminado: false]
	pvp_mode = false
	#Días restantes para retirada del barco pirata. [Predeterminado: 3, min: 1, max: 10]
	#Range: 1 ~ 10
	daysuntilpirateshipsdespawn = 3
	#Máximo nivel Y (altura) para aparición de asaltantes. [Predeterminado: 200, min: 1, max: 500]
	#Range: 1 ~ 500
	maxyforbarbarians = 200

#Todas las configuraciones de permisos
[permissions]
	#¿Debería habilitarse la protección de colonias? [Predeterminado: true]
	enablecolonyprotection = true
	#Establecer la cantidad máxima de copias de seguridad guardadas [Predeterminado: 50, min: 3, max: 5000]
	#Range: 3 ~ 5000
	maxkeptbackups = 50
	#Independientemente de la protección de la colonia, ¿deberían apagarse las explosiones dentro de las colonias? DAMAGE_NOTHING evita las explosiones por completo. DAMAGE_PLAYERS, permite explosiones para dañar a jugadores y mobs hostiles, pero no bloquea o mobs neutrales o amistosos. DAMAGE_ENTITIES permite dañar a todas las entidades. DAMAGE_EVERYTHING permite explosiones para dañar entidades y bloques. 
	#Allowed Values: DAMAGE_NOTHING, DAMAGE_PLAYERS, DAMAGE_ENTITIES, DAMAGE_EVERYTHING
	turnoffexplosionsincolonies = "DAMAGE_ENTITIES"
	#Jugadores que tienen permisos especiales, especialmente para cambiar el nombre de los ciudadanos (ver "Cambios de nombre" más arriba). 
	specialpermgroup = ["_Raycoms_"]
	#Bloques con los que los jugadores pueden interactuar en cualquier colonia(ej: máquinas expendedoras) 
	freetointeractblocks = ["dirt", "0 0 0"]
	#Segundos entre cada mensaje de permiso (para reducir spam). [Predeterminado: 30, min: 1, max: 1000]
	#Range: 1 ~ 1000
	secondsBetweenPermissionMessages = 30

#Todas las configuraciones relacionadas con la compatibilidad de mods
[compatibility]
	#Elementos consumidos por los ciudadanos en la Biblioteca. 
	configliststudyitems = ["minecraft:paper;400;100", "minecraft:book;600;10"]
	#Artículos solicitados por los visitantes de la taberna. 
	configlistrecruitmentitems = ["minecraft:hay_block;3", "minecraft:book;2", "minecraft:enchanted_book;9", "minecraft:diamond;9", "minecraft:emerald;8", "minecraft:baked_potato;1", "minecraft:gold_ingot;2", "minecraft:redstone;2", "minecraft:lapis_lazuli;2", "minecraft:cake;11", "minecraft:sunflower;5", "minecraft:honeycomb;6", "minecraft:quartz;3"]
	#Lista de bloques de mineral que los mineros rara vez encuentran mágicamente (ver "Probabilidad de mineral"). Incluye el bloque y su oportunidad, separados por signos de exclamación. 
	luckyores = ["minecraft:coal_ore!64", "minecraft:copper_ore!48", "minecraft:iron_ore!32", "minecraft:gold_ore!16", "minecraft:redstone_ore!8", "minecraft:lapis_ore!4", "minecraft:diamond_ore!2", "minecraft:emerald_ore!1"]
	#Tamaño talable de tronco para árboles dinámicos: 1-8. [Predeterminado: 5, min: 1, max: 8]
	#Range: 1 ~ 8
	dynamictreeharvestsize = 5
	#Compensación para la máxima durabilidad de la caña no encantada que puede usar una cabaña de pesca T2, en comparación con las herramientas de hierro (250). El hierro de cimentación térmica requiere +6. Las cabañas T3 pueden usar varas no encantadas de cualquier nivel de durabilidad, siempre que puedan recibir daño. Cualquier valor por debajo de -250 solo permitirá varillas de vainilla, excepto lo permitido por T1. [Predeterminado: 6, min: -249, max: 250000]
	#Range: -249 ~ 250000
	fishingroddurabilityadjustt2 = 6
	#Compensación para la máxima durabilidad de la caña no encantada que puede usar una cabaña de pesca T1, en comparación con otras herramientas de madera (59). Las varillas de vainilla siempre funcionan, pero los equivalentes necesitarían +6. El valor predeterminado permite hasta Thermal Foundation Silver Cualquier cosa por debajo de -59 solo permitirá varillas de vainilla. [Predeterminado: 22, min: -58, max: 250000]
	#Range: -58 ~ 250000
	fishingroddurabilityadjustt1 = 22
	#Todas las enfermedades que pueden contraer los ciudadanos. El nombre, lo común que es y todos los ingredientes para curarlo. 
	diseases = ["Influenza,100,minecraft:carrot,minecraft:potato", "Measles,10,minecraft:dandelion,minecraft:kelp,minecraft:poppy", "Smallpox,1,minecraft:honey_bottle,minecraft:golden_apple"]
	#Al cargar recetas, genera archivos CSV de auditoría para ayudar a depurar datapacks o mods adicionales. [Predeterminado: false]
	auditcraftingtags = false
	#Inventarios de depuración. [Predeterminado: false]
	debuginventories = false
	#Activa esta opción si estás usando este mundo para construir y escanear plantillas. [Predeterminado: false]
	blueprintbuildmode = false

#Todas las configuraciones relacionadas con cálculos de ruta
[pathfinding]
	#Mensajes de depuración del comentado de rutas. [Predeterminado: 0, min: 0, max: 10]
	#Range: 0 ~ 10
	pathfindingdebugverbosity = 0
	#Mínimo número de raíles consecutivos para que los ciudadanos los usen. [Predeterminado: 8, min: 5, max: 100]
	#Range: 5 ~ 100
	minimumrailstopath = 8
	#Cantidad de hilos de procesador adicionales a usar en cálculos de ruta. [Predeterminado: 2, min: 1, max: 10]
	#Range: 1 ~ 10
	pathfindingmaxthreadcount = 2

#Todas las configuraciones relacionadas con peticiones del sistema
[requestSystem]
	#La cantidad máxima de reintentos que realizará el sistema de peticiones para solicitudes "reintentables". Un mayor valor aumenta la carga del servidor. [Predeterminado: 3, min: 1, max: 10]
	#Range: 1 ~ 10
	maximalretries = 3
	#La cantidad de tics entre reintentos del sistema de solicitud para solicitudes "reintentables". Un menor valor aumenta la carga del servidor. [Predeterminado: 1200, min: 30, max: 10000]
	#Range: 30 ~ 10000
	delaybetweenretries = 1200
	#¿Debería el sistema de solicitudes resolver creativamente (si es posible) cuándo se requiere que el jugador resuelva una solicitud? Esta es una herramienta de depuración y puede llevar mucho tiempo resolver una solicitud. [Predeterminado: false]
	creativeresolve = false
	#¿Debería permitirse usar el comando '/mc colony requestsystem-reset' a jugadores? [Predeterminado: false]
	canplayeruseresetcommand = false

